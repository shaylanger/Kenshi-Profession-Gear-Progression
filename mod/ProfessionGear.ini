[ProfessionGear]
Enabled=true
AutoClassify=true
# Logs each newly generated eligible item with source/tags/affixes. Useful for test runs; noisy for normal play.
VerboseLogging=false

# Overall multiplier applied to quality-tier affix probabilities.
GlobalChance=1.0

# Increased chance when an NPC's inferred primary profession matches the item.
NpcRoleMultiplier=1.35

# Increased chance for player-crafted eligible items.
PlayerCraftMultiplier=1.15

# Applied to slaves and extremely low-tier NPCs.
PoorNpcMultiplier=0.20
# Previously unseen eligible gear first discovered by the player (e.g. ruin/chest loot).
# Multiplies the normal tier roll chance; 0.50 means half the normal chance.
WorldLootMultiplier=0.50

# Global ceiling. Tier bands further limit this to: low=1, medium=up to 2, top=up to 3.
MaxAffixes=3

# Worker jobs (machines, mines, farms) read the raw skill, so the equipped Labouring/Farming bonus
# is applied to the work each tick (test 177). false = gear only changes the displayed stat.
JobOperateScaling=true

# Farms already read the equipped Farming bonus, so scaling farm work as well counts it twice
# (+50% gear = +109% output). false = farms use only the game's own Farming read (Shay D1).
FarmOperateScaling=false

# Run/swim/stealth/knockout/lockpick formulas read the raw skill, so the equipped Athletics/Swimming/
# Stealth/Assassination/Lockpicking bonus is applied inside those formulas. false = display only.
FormulaScaling=true
